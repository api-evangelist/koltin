aid: koltin
name: Koltin
description: >-
  Koltin is a Mexican health membership company serving older adults, aimed at
  people aged roughly 50 to 84 and at the adult children who want to protect
  their parents and grandparents. Koltin is explicit that it is not an insurer
  and does not sell traditional policies: it packages access to private medical
  care, preventive follow-up, and financial protection against costly illness or
  accident into a membership. The membership pairs a major-medical expense
  insurance product operated and issued by BBVA Seguros Salud with preventive
  medicine — longevity assessments, an integrated medical check-up, video
  consultations, and continuous follow-up — plus a social community program
  (painting, tai chi, film discussion, dance). It operates across CDMX, Estado
  de Mexico, Guadalajara, Monterrey, Queretaro, Puebla, Guanajuato, Cuernavaca,
  Merida, and Veracruz, and publishes a member portal, a hospital network
  directory, and an extensive Spanish-language blog on aging and preventive
  health. Koltin is a 500 Global portfolio company. It publishes no public
  developer portal, API documentation, or machine-readable API specification;
  it does publish a first-party llms.txt describing the site for language
  models.
